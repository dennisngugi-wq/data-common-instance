# Starter feed 2: a JSON data API (World Bank Indicators API, no key needed).

enabled: true
source: WorldBank

dataset:
  # Reuses the Dataset node base Data Commons already has for WDI (as africa-dcp does).
  dcid: "dc/d/WorldBank_WorldDevelopmentIndicators"
  name: "World Development Indicators"
  description: >-
    World Development Indicators (WDI) is the World Bank's primary collection of development indicators,
    compiled from officially recognised international sources. It presents current and accurate global
    development data for more than 200 economies, including national, regional and global estimates.
  url: "https://datacatalog.worldbank.org/search/dataset/0037712/World-Development-Indicators"
  license: "https://creativecommons.org/licenses/by/4.0/"
  license_evidence: >-
    World Bank Data Catalog lists Creative Commons Attribution 4.0 for WDI (0037712); checked 2026-11-12
    (africa-dcp catalog.py).

provenance:
  name: "World Bank WDI total population"
  description: >-
    Total population (series SP.POP.TOTL): all residents regardless of legal status or citizenship, midyear
    estimates, from the World Bank World Development Indicators API, for every country and the World.

fetch:
  type: json
  url: "https://api.worldbank.org/v2/country/all/indicator/SP.POP.TOTL?format=json&per_page=20000&date=1960:2100"
  records: "1"                     # the API returns [paging info, rows]: rows are element 1

mapping:
  place: {column: countryiso3code, match: iso3}
  date: {column: date}
  values:
    value: population_total
  # The World Bank also returns regional and income aggregates (AFE, LMC, ...): leave them out.
  unresolved_places: skip

variables:
  population_total:
    name: "Total population"
    description: >-
      Midyear estimate of all residents of a country regardless of legal status or citizenship
      (World Bank series SP.POP.TOTL).
    group: "Demographics"
    population_type: Person
    measured_property: count       # a plain count of people: no unit
    min: 0
    max: 10000000000
