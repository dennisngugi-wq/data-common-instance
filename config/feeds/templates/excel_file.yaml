enabled: false
source: MyOrganisation

dataset:
  name: "Official title of the table or publication"
  description: >-
    50 to 5000 characters, factual: what is measured, for which places and years, how it is collected,
    and by whom.
  url: "https://example.org/publication-page"
  license: "https://creativecommons.org/licenses/by/4.0/"
  license_evidence: "where the licence is stated"

provenance:
  name: "Short provenance name"

fetch:
  type: excel
  path: "data/inbox/my_table.xlsx"
  sheet: "Table 1"
  header_row: 3

mapping:
  place: {column: County, match: name, type: AdministrativeArea1, within: country/KEN}
  year_columns: true
  variable: population_millions
  scale: 1000000

variables:
  population_millions:
    name: "County population"
    description: "Resident population of the county (mid-year estimate)."
    group: "Demographics"
    population_type: Person
    measured_property: count
    min: 0
    max: 100000000
