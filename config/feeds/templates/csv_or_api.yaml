enabled: false
source: MyOrganisation

dataset:
  name: "Official title"
  description: >-
    50 to 5000 characters, factual: what is measured, for which places and years, how it is collected,
    and by whom.
  url: "https://example.org/dataset"
  license: "https://creativecommons.org/licenses/by/4.0/"
  license_evidence: "where the licence is stated"

provenance:
  name: "Short provenance name"

fetch:
  type: csv
  url: "https://example.org/data/export.csv"

mapping:
  place: {column: iso3, match: iso3}
  date: {column: year}
  values:
    gdp_usd: my_gdp
    unemployment_pct: {variable: my_unemployment, scale: 1}

variables:
  my_gdp:
    name: "GDP (current US$)"
    description: "Gross domestic product at purchasers' prices, current US dollars."
    group: "Economy"
    population_type: EconomicActivity
    unit: USDollar
    min: 0
  my_unemployment:
    name: "Unemployment rate"
    description: "Share of the labour force without work but available for and seeking employment."
    group: "Economy"
    population_type: Person
    unit: Percent
    min: 0
    max: 100
