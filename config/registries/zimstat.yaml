datasets_tab: "Extracted"
default_source: ZIMSTAT
allow_future: true

columns:
  id: "Dataset ID"
  name: "Dataset Name"
  description: "Description"
  organisation: "Source Organization"
  url: "Source URL"
  provenance_url: "Provenance URL"
  content_url: "Source file link"
  license: "License URL"
  license_name: "License Type"
  domain: "Domain"
  subdomain: "Sub-domain"
  update_frequency: "update_frequency"
  last_update: "source_last_update_date"
  min_date: "Min Date"
  max_date: "Max Date"

data:
  type: jsonstat
  method: POST
  body: []

mapping:
  place_codes: '^(ZW|ZW_\d|ZW_[A-Z]{2}|ZW_\d{3}|[A-Z]{2})$'
  place_map: {ZW: country/ZWE}
  place_within: country/ZWE
  place_types:
    '^ZW_\d$': AdministrativeArea1
    '^[A-Z]{2}$': AdministrativeArea1
    '^ZW_[A-Z]{2}$': AdministrativeArea1
    '^ZW_\d{3}$': AdministrativeArea2
  default_place: country/ZWE
  variable_prefix: "ZIMSTAT_"
