{%- extends BASE_HTML -%}
{% set main_id = 'dataset-main' %}
{% set page_id = 'page-dataset' %}
{% set title = 'Dataset' %}
{% block head %}
<style>
  #dcp-dataset { max-width: 1100px; margin: 0 auto; padding: 28px 16px 64px; font-family: "Google Sans Text", Roboto, sans-serif; }
  #dcp-dataset .crumb { font-size: .9rem; margin-bottom: 10px; }
  #dcp-dataset h1 { font-size: 2rem; font-weight: 400; margin: 0 0 6px; }
  #dcp-dataset h2 { font-size: 1.3rem; font-weight: 400; margin: 34px 0 10px; }
  #dcp-dataset .src { color: #5f6368; margin-bottom: 12px; }
  #dcp-dataset .desc { color: #333; max-width: 860px; }
  #dcp-dataset .stats { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0; }
  #dcp-dataset .stat { border: 1px solid #e3e3e3; border-radius: 12px; padding: 10px 14px; min-width: 120px; background: #fff; }
  #dcp-dataset .stat b { display: block; font-size: 1.2rem; font-weight: 500; }
  #dcp-dataset .stat span { color: #5f6368; font-size: .8rem; }
  #dcp-dataset .links a { margin-right: 16px; font-size: .9rem; white-space: nowrap; }
  #dcp-dataset .pending { color: #a50e0e; }
  #dcp-dataset table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  #dcp-dataset th, #dcp-dataset td { text-align: left; padding: 7px 10px; border-bottom: 1px solid #eee; vertical-align: top; }
  #dcp-dataset th { color: #5f6368; font-weight: 500; position: sticky; top: 0; background: #fff; }
  #dcp-dataset td.n, #dcp-dataset th.n { text-align: right; font-variant-numeric: tabular-nums; }
  #dcp-dataset .scroll { max-height: 420px; overflow: auto; border: 1px solid #e3e3e3; border-radius: 12px; }
  #dcp-dataset tr.pick { cursor: pointer; }
  #dcp-dataset tr.pick:hover { background: #f1f5fe; }
  #dcp-dataset tr.on { background: #e8f0fe; }
  #dcp-dataset .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
  #dcp-dataset select, #dcp-dataset input[type=search] { padding: 9px 14px; border: 1px solid #c4c7c5; border-radius: 20px;
    font-size: .92rem; max-width: 100%; }
  #dcp-dataset select { flex: 1 1 360px; }
  #dcp-dataset input[type=search] { flex: 1 1 220px; }
  #dcp-dataset .chart { border: 1px solid #e3e3e3; border-radius: 12px; padding: 10px; margin-bottom: 12px; background: #fff; }
  #dcp-dataset .chart svg { width: 100%; height: auto; display: block; }
  #dcp-dataset .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .82rem; padding: 4px 6px; }
  #dcp-dataset .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
  #dcp-dataset .muted { color: #5f6368; font-size: .85rem; }
  #dcp-dataset .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  #dcp-dataset .chip { border: 1px solid #dadce0; border-radius: 16px; padding: 4px 12px; font-size: .85rem; background: #fff;
    cursor: pointer; }
  #dcp-dataset .chip.on { background: #e8f0fe; border-color: #aecbfa; color: #0751b3; }
  #dcp-dataset .more { margin-top: 8px; }
</style>
{% endblock %}
{% block content %}
<div id="dcp-dataset" data-dcid="{{ dataset_dcid }}">
  <div class="crumb"><a href="/data">← All data sources</a></div>
  <div id="ds-body">Loading…</div>
</div>
<script>
(function () {
  var root = document.getElementById('dcp-dataset'), body = document.getElementById('ds-body');
  var dcid = root.getAttribute('data-dcid'), api = '/api/custom/dataset/' + encodeURIComponent(dcid);
  var COLORS = ['#1a73e8', '#e8710a', '#188038', '#d93025', '#9334e6', '#12b5cb', '#f9ab00', '#5f6368'];
  var info, obs = [], state = { v: null, place: '', q: '', limit: 300 };
  var params = new URLSearchParams(location.search);

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]; }); }
  function num(x) { return Math.abs(x) >= 1e4 ? Math.round(x).toLocaleString() : (+x.toPrecision(6)).toLocaleString(); }
  function short(x) {
    var a = Math.abs(x);
    if (a >= 1e9) return +(x / 1e9).toFixed(1) + 'B';
    if (a >= 1e6) return +(x / 1e6).toFixed(1) + 'M';
    if (a >= 1e3) return +(x / 1e3).toFixed(1) + 'k';
    return +x.toPrecision(3) + '';
  }
  function placeName(d) { return (info.placeIndex[d] || {}).name || d; }
  function stat(v, l) { return '<div class="stat"><b>' + esc(v) + '</b><span>' + esc(l) + '</span></div>'; }

  function renderShell() {
    var m = info.meta, s = info.source || {};
    document.title = m.name + ' - Data sources';
    var lic = '<a href="' + esc(m.license) + '" target="_blank" rel="noopener">Licence: ' +
      esc(m.license.replace(/^https?:\/\//, '')) + '</a>';
    body.innerHTML =
      '<h1>' + esc(m.name) + '</h1>' +
      '<div class="src">Published by ' + (s.url ? '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' +
        esc(s.name) + '</a>' : esc(s.name || '')) + ' · ' + lic + '</div>' +
      '<p class="desc">' + esc(m.description) + '</p>' +
      '<div class="stats">' + stat(m.rows.toLocaleString(), 'values') + stat(info.variables.length, 'variables') +
        stat(info.places.length, 'places') + stat((m.first_date || '') + ' – ' + (m.last_date || ''), 'coverage') +
        stat(m.refreshed || '—', 'last refreshed') + '</div>' +
      '<div class="links">' +
        '<a href="' + api + '?format=csv">Download all values (CSV)</a>' +
        (m.url ? '<a href="' + esc(m.url) + '" target="_blank" rel="noopener">Original source ↗</a>' : '') +
        (m.data_url ? '<a href="' + esc(m.data_url) + '" target="_blank" rel="noopener">Raw data ↗</a>' : '') +
        '<a href="/browser/' + esc(m.dcid) + '">Knowledge graph</a>' +
        '<a href="/croissant/' + esc(m.dcid) + '">Croissant JSON-LD</a>' +
      '</div>' +
      '<h2>Data</h2>' +
      '<div class="controls"><select id="ds-var" aria-label="Variable"></select>' +
        '<input id="ds-q" type="search" placeholder="Filter places or dates"></div>' +
      '<div id="ds-chart" class="chart"></div>' +
      '<div class="scroll"><table><thead><tr><th>Place</th><th>Date</th><th class="n">Value</th><th>Unit</th></tr></thead>' +
        '<tbody id="ds-rows"></tbody></table></div><div id="ds-more" class="more muted"></div>' +
      '<h2>Variables (' + info.variables.length + ')</h2>' +
      '<div class="scroll"><table><thead><tr><th>Variable</th><th class="n">Values</th><th class="n">Places</th>' +
        '<th>Dates</th><th>Unit</th></tr></thead><tbody id="ds-vars"></tbody></table></div>' +
      '<h2>Places (' + info.places.length + ')</h2>' +
      '<div class="chips" id="ds-places"></div>';

    var sel = document.getElementById('ds-var');
    sel.innerHTML = info.variables.map(function (v) {
      return '<option value="' + esc(v.dcid) + '">' + esc(v.name) + ' (' + v.count + ')</option>'; }).join('');
    sel.addEventListener('change', function () { selectVar(sel.value); });
    document.getElementById('ds-q').addEventListener('input', function (e) {
      state.q = e.target.value.toLowerCase(); state.limit = 300; renderData(); });

    document.getElementById('ds-vars').innerHTML = info.variables.map(function (v) {
      return '<tr class="pick" data-v="' + esc(v.dcid) + '"><td>' + esc(v.name) + '<div class="muted">' + esc(v.dcid) +
        '</div></td><td class="n">' + v.count.toLocaleString() + '</td><td class="n">' + v.places + '</td><td>' +
        esc(v.first_date) + (v.last_date !== v.first_date ? ' – ' + esc(v.last_date) : '') + '</td><td>' +
        esc(v.units.join(', ')) + '</td></tr>';
    }).join('');
    document.getElementById('ds-vars').addEventListener('click', function (e) {
      var tr = e.target.closest('tr[data-v]');
      if (tr) { selectVar(tr.getAttribute('data-v')); document.getElementById('ds-var').scrollIntoView({behavior: 'smooth', block: 'center'}); }
    });

    var chips = document.getElementById('ds-places');
    chips.innerHTML = info.places.map(function (p) {
      return '<span class="chip" data-p="' + esc(p.dcid) + '" title="' + esc(p.dcid) + '">' + esc(p.name) +
        ' · ' + p.count.toLocaleString() + '</span>'; }).join('');
    chips.addEventListener('click', function (e) {
      var c = e.target.closest('[data-p]');
      if (!c) return;
      var p = c.getAttribute('data-p');
      state.place = state.place === p ? '' : p; state.limit = 300;
      Array.prototype.forEach.call(chips.children, function (x) { x.classList.toggle('on', x.getAttribute('data-p') === state.place); });
      renderData();
      document.getElementById('ds-var').scrollIntoView({behavior: 'smooth', block: 'center'});
    });
  }

  function selectVar(v) {
    state.v = v; state.limit = 300;
    document.getElementById('ds-var').value = v;
    Array.prototype.forEach.call(document.querySelectorAll('#ds-vars tr'), function (tr) {
      tr.classList.toggle('on', tr.getAttribute('data-v') === v); });
    var p = new URLSearchParams(location.search); p.set('v', v);
    history.replaceState(null, '', location.pathname + '?' + p.toString());
    document.getElementById('ds-rows').innerHTML = '<tr><td colspan="4">Loading…</td></tr>';
    fetch(api + '?v=' + encodeURIComponent(v)).then(function (r) { return r.json(); }).then(function (d) {
      if (state.v !== v) return;
      obs = d.observations || []; renderData();
    });
  }

  function filtered() {
    return obs.filter(function (o) {
      if (state.place && o[0] !== state.place) return false;
      if (!state.q) return true;
      return (placeName(o[0]) + ' ' + o[0] + ' ' + o[2]).toLowerCase().indexOf(state.q) >= 0;
    });
  }

  function renderData() {
    var rows = filtered().slice().sort(function (a, b) {
      return placeName(a[0]).localeCompare(placeName(b[0])) || (a[2] < b[2] ? 1 : a[2] > b[2] ? -1 : 0); });
    document.getElementById('ds-rows').innerHTML = rows.slice(0, state.limit).map(function (o) {
      return '<tr><td>' + esc(placeName(o[0])) + '</td><td>' + esc(o[2]) + '</td><td class="n">' + num(o[3]) +
        '</td><td>' + esc(o[4]) + '</td></tr>'; }).join('') || '<tr><td colspan="4">No values match.</td></tr>';
    var more = document.getElementById('ds-more');
    more.innerHTML = rows.length > state.limit ? 'Showing ' + state.limit + ' of ' + rows.length.toLocaleString() +
      ' values. <a href="#" id="ds-all">Show all</a>' : rows.length.toLocaleString() + ' value(s)';
    var all = document.getElementById('ds-all');
    if (all) all.addEventListener('click', function (e) { e.preventDefault(); state.limit = Infinity; renderData(); });
    renderChart(rows);
  }

  function renderChart(rows) {
    var el = document.getElementById('ds-chart');
    if (!rows.length) { el.innerHTML = '<span class="muted">No values to chart.</span>'; return; }
    var dates = Array.from(new Set(rows.map(function (o) { return o[2]; }))).sort();
    var byPlace = {};
    rows.forEach(function (o) { (byPlace[o[0]] = byPlace[o[0]] || {})[o[2]] = o[3]; });
    var places = Object.keys(byPlace);
    var unit = rows[0][4] ? ' (' + rows[0][4] + ')' : '';
    if (dates.length > 1) lineChart(el, dates, byPlace, places, unit);
    else barChart(el, dates[0], byPlace, places, unit);
  }

  function lineChart(el, dates, byPlace, places, unit) {
    places.sort(function (a, b) { return Object.keys(byPlace[b]).length - Object.keys(byPlace[a]).length ||
      placeName(a).localeCompare(placeName(b)); });
    var shown = places.slice(0, 8), W = 900, H = 320, L = 64, R = 16, T = 14, B = 40;
    var vals = [];
    shown.forEach(function (p) { dates.forEach(function (d) { if (byPlace[p][d] != null) vals.push(byPlace[p][d]); }); });
    var lo = Math.min(0, Math.min.apply(null, vals)), hi = Math.max.apply(null, vals);
    if (hi === lo) hi = lo + 1;
    var x = function (i) { return L + (W - L - R) * (dates.length === 1 ? .5 : i / (dates.length - 1)); };
    var y = function (v) { return T + (H - T - B) * (1 - (v - lo) / (hi - lo)); };
    var svg = [];
    for (var k = 0; k <= 4; k++) {
      var gv = lo + (hi - lo) * k / 4, gy = y(gv);
      svg.push('<line x1="' + L + '" x2="' + (W - R) + '" y1="' + gy + '" y2="' + gy + '" stroke="#eee"/>' +
        '<text x="' + (L - 8) + '" y="' + (gy + 4) + '" text-anchor="end" font-size="11" fill="#5f6368">' + short(gv) + '</text>');
    }
    var step = Math.ceil(dates.length / 10);
    dates.forEach(function (d, i) {
      if (i % step === 0 || i === dates.length - 1)
        svg.push('<text x="' + x(i) + '" y="' + (H - B + 18) + '" text-anchor="middle" font-size="11" fill="#5f6368">' + esc(d) + '</text>');
    });
    shown.forEach(function (p, pi) {
      var pts = [], c = COLORS[pi % COLORS.length];
      dates.forEach(function (d, i) { if (byPlace[p][d] != null) pts.push([x(i), y(byPlace[p][d]), d, byPlace[p][d]]); });
      if (pts.length > 1) svg.push('<polyline fill="none" stroke="' + c + '" stroke-width="2" points="' +
        pts.map(function (q) { return q[0] + ',' + q[1]; }).join(' ') + '"/>');
      pts.forEach(function (q) { svg.push('<circle cx="' + q[0] + '" cy="' + q[1] + '" r="' + (pts.length > 40 ? 1.5 : 3) +
        '" fill="' + c + '"><title>' + esc(placeName(p)) + ', ' + esc(q[2]) + ': ' + num(q[3]) + '</title></circle>'); });
    });
    el.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Values over time">' + svg.join('') + '</svg>' +
      '<div class="legend">' + shown.map(function (p, i) { return '<span><i style="background:' + COLORS[i % COLORS.length] +
      '"></i>' + esc(placeName(p)) + '</span>'; }).join('') +
      (places.length > shown.length ? '<span class="muted">+' + (places.length - shown.length) +
      ' more places in the table (click a place below to chart it)</span>' : '') +
      (unit ? '<span class="muted">' + esc(unit) + '</span>' : '') + '</div>';
  }

  function barChart(el, date, byPlace, places, unit) {
    places.sort(function (a, b) { return byPlace[b][date] - byPlace[a][date]; });
    var shown = places.slice(0, 25), W = 900, rowH = 22, L = 220, R = 70, H = shown.length * rowH + 10;
    var vals = shown.map(function (p) { return byPlace[p][date]; });
    var lo = Math.min(0, Math.min.apply(null, vals)), hi = Math.max(0, Math.max.apply(null, vals)) || 1;
    var x = function (v) { return L + (W - L - R) * (v - lo) / (hi - lo); };
    var svg = shown.map(function (p, i) {
      var v = byPlace[p][date], y0 = i * rowH + 5, x0 = Math.min(x(0), x(v)), w = Math.max(1, Math.abs(x(v) - x(0)));
      var name = placeName(p); if (name.length > 32) name = name.slice(0, 31) + '…';
      return '<text x="' + (L - 8) + '" y="' + (y0 + 14) + '" text-anchor="end" font-size="12" fill="#333">' + esc(name) + '</text>' +
        '<rect x="' + x0 + '" y="' + (y0 + 3) + '" width="' + w + '" height="' + (rowH - 8) + '" rx="3" fill="' + COLORS[0] + '">' +
        '<title>' + esc(placeName(p)) + ': ' + num(v) + '</title></rect>' +
        '<text x="' + (x0 + w + 6) + '" y="' + (y0 + 14) + '" font-size="11" fill="#5f6368">' + short(v) + '</text>';
    });
    el.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Values by place">' + svg.join('') + '</svg>' +
      '<div class="legend"><span class="muted">' + esc(date) + esc(unit) +
      (places.length > shown.length ? ' · top ' + shown.length + ' of ' + places.length + ' places' : '') + '</span></div>';
  }

  fetch(api).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (d) {
    info = d; info.placeIndex = {};
    d.places.forEach(function (p) { info.placeIndex[p.dcid] = p; });
    renderShell();
    var start = params.get('v');
    if (!d.variables.some(function (v) { return v.dcid === start; })) start = d.variables.length ? d.variables[0].dcid : null;
    if (start) selectVar(start);
  }).catch(function (e) {
    console.error('dataset page', e);
    body.innerHTML = '<p>This dataset is not loaded in this Data Commons. <a href="/data">See all data sources</a>.</p>';
  });
})();
</script>
{% endblock %}
