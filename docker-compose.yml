name: dcproject

x-dc-env: &dc-env
  env_file:
    - path: env.list
      required: false
  platform: linux/amd64

services:
  website:
    <<: *dc-env
    image: gcr.io/datcom-ci/datacommons-services:stable
    environment:
      INPUT_DIR: /data
      OUTPUT_DIR: /out
      USE_SQLITE: "true"
      DISABLE_GOOGLE_MAPS: ${DISABLE_GOOGLE_MAPS:-true}
      SITE_URL: ${SITE_URL:-}
    volumes:
      - ${HOST_PROJECT_DIR:?set HOST_PROJECT_DIR in .env}/imports/local_dc:/data:ro
      - ${HOST_PROJECT_DIR}/imports/local_dc_db:/out
      - ${HOST_PROJECT_DIR}/pipeline/site/app_env/custom.py:/workspace/server/app_env/custom.py:ro
      - ${HOST_PROJECT_DIR}/pipeline/site/templates:/workspace/server/templates/custom_dc/custom:ro
      - ${HOST_PROJECT_DIR}/pipeline/site/templates_core/explore_landing.html:/workspace/server/templates/explore_landing.html:ro
      - ${HOST_PROJECT_DIR}/pipeline/site/static:/workspace/server/dist/custom_dc/custom:ro
      - ${HOST_PROJECT_DIR}/pipeline/site/data:/workspace/custom_data:ro
      - ${HOST_PROJECT_DIR}/pipeline/config/instance.yaml:/workspace/instance.yaml:ro
      - ${HOST_PROJECT_DIR}/pipeline/site/config/home_page/sample_questions.json:/workspace/server/config/home_page/sample_questions.json:ro
      - ${HOST_PROJECT_DIR}/pipeline/site/config/home_page/partners.json:/workspace/server/config/home_page/partners.json:ro
      - ${HOST_PROJECT_DIR}/pipeline/site/config/home_page/topics.json:/workspace/server/config/home_page/topics.json:ro
      - ${HOST_PROJECT_DIR}/pipeline/site/config/feature_flags/custom.json:/workspace/server/config/feature_flag_configs/custom.json:ro
      - ${HOST_PROJECT_DIR}/pipeline/site/config/header.json:/workspace/server/config/custom_dc/custom/base/header.json:ro
      - ${HOST_PROJECT_DIR}/pipeline/site/config/footer.json:/workspace/server/config/base/footer.json:ro
      # Memory-safe launch script (fewer gunicorn workers + recycling)
      - ${HOST_PROJECT_DIR}/pipeline/docker/run.sh:/workspace/run.sh:ro
    ports:
      - "${SITE_PORT:-8090}:8080"
    mem_limit: 3g
    memswap_limit: 6g
    restart: unless-stopped
    profiles: ["site"]

  scheduler:
    image: docker:27-cli
    working_dir: /project
    environment:
      HOST_PROJECT_DIR: ${HOST_PROJECT_DIR}
      REFRESH_AT_UTC: ${REFRESH_AT_UTC:-21:00}
      REFRESH_ON_START: ${REFRESH_ON_START:-true}
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
      PATH: /project/pipeline/docker/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_PROJECT_DIR}:/project
    command: ["sh", "/project/pipeline/docker/scheduler.sh"]
    restart: unless-stopped

  pipeline:
    <<: *dc-env
    build: ./pipeline
    image: dcproject-pipeline:latest
    profiles: ["jobs"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /project
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      KNOWLEDGE_DIR: /knowledge
      SITE_URL: ${SITE_URL:-}
    volumes:
      - ${HOST_PROJECT_DIR}:/project
      - type: bind
        source: ${KNOWLEDGE_HOST_DIR:-${HOST_PROJECT_DIR}/../../mcp agent/knowledge}
        target: /knowledge
    command:
      - sh
      - -c
      - |
        python pipeline/src/run_pipeline.py
        rc=$$?
        python pipeline/src/build_local_dc.py || exit 2
        python pipeline/src/build_place_index.py
        exit $$rc

  loader:
    <<: *dc-env
    image: gcr.io/datcom-ci/datacommons-data:stable
    profiles: ["jobs"]
    environment:
      INPUT_DIR: /data
      OUTPUT_DIR: /out
      USE_SQLITE: "true"
    volumes:
      - ${HOST_PROJECT_DIR}/imports/local_dc:/data:ro
      - ${HOST_PROJECT_DIR}/imports/local_dc_db_next:/out
